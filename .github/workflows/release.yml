name: Release

# Runs the full CI, then publishes the Docker image to the GitHub Container
# Registry and creates a GitHub release. Started by auto-release.yml after
# every merge into main, or by pushing a version tag by hand
# (`git tag v1.2.0 && git push origin v1.2.0`).
on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      tag:
        description: The version to release, e.g. v1.2.0
        type: string
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  docker:
    name: Docker-Image veröffentlichen
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags v1.2.3 as 1.2.3, 1.2 and latest; pre-releases (v1.2.3-rc.1)
      # only get their own tag, so `latest` stays on the last stable version.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ !contains(env.TAG, '-') }}
          flavor: |
            latest=false
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub-Release erstellen
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release mit automatisch erzeugten Notizen anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}:${TAG#v}"
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          # --target: from auto-release.yml the tag doesn't exist yet and is
          # created on the released commit.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            --notes "Docker-Image: \`docker pull $image\`"
