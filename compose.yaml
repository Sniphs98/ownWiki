services:
  app:
    build: .
    restart: always
    ports:
      - 3000:3000
    env_file:
      - .env
    volumes:
      - wikidata:/app/data

  # Only needed when DATABASE_DIALECT=postgresql. The default (sqlite)
  # setup needs nothing but the `app` service above.
  # Start both with: docker compose --profile postgresql up
  db:
    image: postgres
    restart: always
    profiles: [postgresql]
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - pgdata:/var/lib/postgresql

  # Optional: semantic search on your own hardware — no GPU needed, nothing
  # leaves the server. In .env set EMBEDDINGS_URL=http://ollama:11434/v1 and
  # EMBEDDINGS_MODEL=bge-m3, then start with: docker compose --profile ollama up -d
  ollama:
    image: ollama/ollama
    restart: always
    profiles: [ollama]
    environment:
      # Keep the model in memory, so a search after a quiet hour doesn't
      # wait for it to load.
      OLLAMA_KEEP_ALIVE: -1
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: [CMD, ollama, list]
      interval: 5s
      retries: 12

  # Downloads the model once (bge-m3: about 1.2 GB) and exits. The wiki
  # embeds its pages as soon as the model is there.
  ollama-pull:
    image: ollama/ollama
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: [ollama, pull, '${EMBEDDINGS_MODEL:-bge-m3}']

volumes:
  pgdata:
  wikidata:
  ollama:
